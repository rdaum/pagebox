# Application-cache-pressure YCSB-C with an explicit 80/20 hot/cold split.
# The hot 20% of the roughly 128 MiB deterministic data set fits inside the
# 64 MiB engine-managed cache while cold accesses continue to force turnover.
workload = "ycsb_c"
distribution = { kind = "hotspot", params = { hot_data_fraction = 0.2, hot_operation_fraction = 0.8 } }
record_count = 65536
value_size = 2048
operation_count = 200000
minimum_duration_secs = 3
seed = 42
threads = 4

[comparison]
id = "application-cache-pressure-hotspot-ycsb-c"
engines = ["kvstore", "fjall", "redb", "rocksdb"]
memory_regime = "application_cache"
operation_contract = "point_read"

[engine_opts]
sync_mode = "relaxed"
cache_budget_bytes = 67108864
